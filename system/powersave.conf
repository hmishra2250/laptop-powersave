# powersave configuration. install.sh copies this to /etc/powersave.conf.
# The root AC hook and the `powersave` command both read /etc/powersave.conf;
# `powersave` then reads ~/.config/powersave/config, if it exists, for
# per-user overrides. Values are shell assignments.

# --- Limits applied automatically when AC is lost (tier 0) ---------------
# CAP_PCT=100 means no CPU cap on battery (expect much shorter runtime and more heat).
CAP_PCT=50
CAP_BRIGHT=40

# --- Hardware ------------------------------------------------------------
# Backlight device under /sys/class/backlight.
BACKLIGHT=intel_backlight
# PCI address of the NVIDIA card, in the form domain:bus:device.function
# (see `lspci -D | grep -i nvidia`).
# Empty: use the first NVIDIA display device found in /sys/bus/pci/devices.
DGPU_PCI=
# Wi-Fi interfaces to put in power-save mode, space separated, e.g. wlan0.
# Empty: every wireless interface found in /sys/class/net.
WIFI_IF=

# --- What `powersave save` stops -----------------------------------------
# If ~/.config/powersave/workloads exists (install.sh creates it from
# system/workloads.example), it decides what is stopped, what keeps running and
# what restore restarts, asks about or leaves stopped, and the four lists below
# are ignored. Without it, these lists apply, every running docker container is
# stopped, and restore restarts everything it stopped.
# System units stopped if active (restarted by restore).
SYS_UNITS="docker.socket docker.service containerd.service ModemManager.service
virtlockd.socket virtlogd.socket virtlockd.service virtlogd.service
kerneloops.service fwupd.service unattended-upgrades.service bluetooth.service"
# Your own systemd --user units to stop, e.g. "sync.service backup.timer".
USER_UNITS=
# User units stopped only in headless mode (things that need the desktop or the GPU).
HEADLESS_USER_UNITS=
# Applications closed by `powersave save` (not reopened by restore).
APPS="slack zoom obsidian spotify discord"
# Extra process patterns (extended regex) that `save --aggressive` must never close,
# e.g. "myeditor|myagent".
KEEP_EXTRA=

# --- Optional hook ------------------------------------------------------
# Command run by `powersave restore` after it has restarted what it stopped.
# Off when empty. It runs as your user, with these variables set:
#   POWERSAVE_STOPPED_AT   ISO 8601 time `save` first stopped background work
#   POWERSAVE_RESTORED_AT  ISO 8601 time of this restore
# Use it, for example, to ask a recorder or sync job to catch up on the gap.
# If the command fails, the start time is kept and the next restore runs it again.
# When a container with the `backfill` flag (see workloads.example) was stopped,
# POWERSAVE_STOPPED_AT is the start of that coverage gap instead, and the hook
# waits until such a container is running again. A window older than
# backfill_max_age_h hours runs only after an explicit y at the prompt.
POST_RESTORE_HOOK=
